<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PhD Flappy: Publish or Perish</title>
<style>
  :root{
    --gold:#e6b428;
    --panel:#191928;
  }
  html,body{
    margin:0; padding:0; height:100%;
    background:#05050d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    overscroll-behavior:none;
  }
  #game-wrap{
    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio:480/800;
    margin:0 auto;
    background:#000;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  @media (min-height:500px) and (min-width:481px){
    #game-wrap{ max-height:96vh; width:auto; height:96vh; }
  }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  .overlay{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(4,4,16,0.90);
    color:#fff; text-align:center; padding:28px; box-sizing:border-box;
  }
  .hidden{ display:none !important; }

  .title{ font-size:clamp(22px,7vw,32px); font-weight:800; color:var(--gold); margin:0 0 2px; letter-spacing:0.5px;}
  .subtitle{ font-size:clamp(12px,3.6vw,15px); color:#cfd3e6; margin:0 0 18px; }

  .lang-row{ display:flex; gap:10px; margin-bottom:16px; }
  .lang-btn{
    padding:8px 18px; border-radius:999px; border:2px solid #444a66;
    background:#12121f; color:#c9cde0; font-size:14px; font-weight:700; cursor:pointer;
  }
  .lang-btn.active{ border-color:var(--gold); color:var(--gold); background:#1f1b0d; }

  .char-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    width:100%; max-width:320px; margin:0 0 10px;
  }
  .char-btn{
    border:2px solid #444a66; border-radius:10px; background:#0f0f1c;
    padding:4px; cursor:pointer; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .char-btn img{ width:100%; height:100%; object-fit:contain; }
  .char-btn.selected{ border-color:var(--gold); background:#1f1b0d; }
  .char-label{ font-size:11px; color:#9aa0bf; margin-bottom:10px; }

  .big-btn{
    padding:14px 36px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#f3cb4e,#d99b1f); color:#231a00;
    font-size:18px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #8a6610;
    letter-spacing:0.5px;
  }
  .big-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #8a6610; }

  .hint{ margin-top:18px; font-size:13px; color:#9aa0bf; }

  .panel{
    width:100%; max-width:380px; background:var(--panel); border:3px solid var(--gold);
    border-radius:16px; padding:18px 18px 16px; box-sizing:border-box;
  }
  .panel-head{ color:var(--gold); font-weight:800; font-size:13px; letter-spacing:1px; margin-bottom:10px; text-transform:uppercase;}
  .q-text{ font-size:18px; font-weight:700; line-height:1.3; margin-bottom:14px; min-height:46px; }
  .opt-btn{
    display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px;
    border-radius:10px; border:2px solid #39405e; background:#0f0f1c; color:#fff;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct{ border-color:#5ddc6b; background:#102a14; color:#8df0a0; }
  .opt-btn.wrong{ border-color:#e05a5a; background:#2a1010; color:#f0a0a0; }
  .feedback{ margin-top:10px; font-size:14px; font-weight:700; min-height:18px; }

  .go-title{ font-size:clamp(26px,8vw,36px); font-weight:900; color:#ff5a5a; margin:0 0 10px; }
  .face-wrap{
    width:92px; height:92px; border-radius:50%; background:#fff; border:3px solid var(--gold);
    display:flex; align-items:center; justify-content:center; margin-bottom:14px; overflow:hidden;
  }
  .face-wrap img{ width:84%; height:84%; object-fit:contain; }
  .go-msg{ font-size:14px; color:#f0f0f0; margin-bottom:10px; max-width:360px;}
  .go-score{ font-size:18px; font-weight:800; margin-bottom:4px;}
  .go-stage{ font-size:13px; color:#c9cde0; margin-bottom:16px;}

  .ghost-btn{
    padding:10px 18px; border-radius:10px; border:2px solid #444a66;
    background:transparent; color:#c9cde0; font-size:13px; font-weight:700; cursor:pointer;
  }
  .ghost-btn:active{ background:#191928; }
  .ghost-btn:disabled{ opacity:0.6; cursor:default; }

  .row-gap{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .name-row{ width:100%; max-width:300px; margin:4px 0 6px; }
  .name-input{
    width:100%; box-sizing:border-box; padding:11px 14px; border-radius:10px;
    border:2px solid #444a66; background:#0f0f1c; color:#fff; font-size:15px; text-align:center;
  }
  .name-input::placeholder{ color:#6a7090; }
  .name-warn{ color:#ff8f8f; font-size:12px; min-height:16px; margin-bottom:8px; max-width:300px; }

  .submit-status{ font-size:12px; min-height:16px; margin-top:6px; color:#9aa0bf; }

  .lb-panel{ width:100%; max-width:380px; max-height:70vh; overflow-y:auto; }
  .lb-list{ margin-top:6px; }
  .lb-row{
    display:flex; align-items:center; gap:10px; padding:8px 4px;
    border-bottom:1px solid #2a2a3e; font-size:14px;
  }
  .lb-row .rank{ width:30px; color:var(--gold); font-weight:800; flex-shrink:0; }
  .lb-row .name{ flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-row .hidx{ font-weight:800; flex-shrink:0; }
  .lb-empty{ color:#9aa0bf; font-size:13px; padding:20px 0; }

  #overlay-countdown{ z-index:6; background:rgba(4,4,16,0.35); pointer-events:none; }
  #countdown-num{ font-size:110px; font-weight:900; color:var(--gold); text-shadow:0 4px 14px rgba(0,0,0,0.6); }

  #toast{
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); color:#ffe678; font-weight:700; font-size:13px;
    padding:8px 14px; border-radius:8px; z-index:4; pointer-events:none; opacity:0; transition:opacity .25s;
    white-space:nowrap; max-width:90%; text-align:center;
  }
  #toast.show{ opacity:1; }

  #hud{
    position:absolute; top:10px; left:14px; z-index:3; pointer-events:none;
    font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  #hud .score{ font-size:20px; }
  #hud .stage{ font-size:12px; opacity:0.9; margin-top:2px; }
  #hud .stars-count{ font-size:12px; margin-top:2px; opacity:0.95; }
  #energy-wrap{ margin-top:6px; width:120px; }
  #energy-bar{ width:100%; height:8px; background:rgba(255,255,255,0.18); border-radius:4px; overflow:hidden; }
  #energy-fill{ height:100%; width:100%; background:linear-gradient(90deg,#ff5a3c,#ffd23c); }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="score" id="hud-score">0</div>
    <div class="stage" id="hud-stage"></div>
    <div class="stars-count" id="hud-stars"></div>
    <div id="energy-wrap" class="hidden">
      <div id="energy-bar"><div id="energy-fill"></div></div>
    </div>
  </div>
  <div id="toast"></div>

  <div class="overlay" id="overlay-start">
    <div class="title">PhD Flappy</div>
    <div class="subtitle" id="start-subtitle">Publish or Perish</div>
    <div class="lang-row">
      <button class="lang-btn active" id="btn-lang-tr" data-lang="tr">Türkçe</button>
      <button class="lang-btn" id="btn-lang-en" data-lang="en">English</button>
    </div>
    <div class="char-label" id="char-label">Karakterini seç</div>
    <div class="char-grid" id="char-grid"></div>
    <div class="name-row">
      <input class="name-input" id="start-name-input" maxlength="24" placeholder="İsminiz (opsiyonel)" autocomplete="off">
    </div>
    <div class="name-warn" id="start-name-warn"></div>
    <button class="big-btn" id="btn-start">BAŞLA</button>
    <button class="ghost-btn" id="btn-show-leaderboard" style="margin-top:12px;">🏆 Liderlik Tablosu</button>
    <div class="hint" id="start-hint">İsmini yaz, SPACE'e bas ya da BAŞLA'ya tıkla</div>
  </div>

  <div class="overlay hidden" id="overlay-trivia">
    <div class="panel">
      <div class="panel-head">ASTRONOMY CHECK</div>
      <div class="q-text" id="trivia-q"></div>
      <button class="opt-btn" data-i="0"></button>
      <button class="opt-btn" data-i="1"></button>
      <button class="opt-btn" data-i="2"></button>
      <div class="feedback" id="trivia-feedback"></div>
    </div>
  </div>

  <div class="overlay hidden" id="overlay-countdown">
    <div id="countdown-num">3</div>
  </div>

  <div class="overlay hidden" id="overlay-gameover">
    <div class="go-title" id="go-title">REDDEDILDI!</div>
    <div class="face-wrap" id="go-face-wrap"><img id="go-face" src="" alt=""></div>
    <div class="go-msg" id="go-msg"></div>
    <div class="go-score" id="go-score"></div>
    <div class="go-stage" id="go-stage"></div>
    <div id="score-submit-block">
      <div class="name-row">
        <input class="name-input" id="name-input" maxlength="24" placeholder="Dr. Procrastinator">
      </div>
      <div class="row-gap">
        <button class="ghost-btn" id="btn-submit-score">h-index Tablosuna Gönder</button>
      </div>
      <div class="submit-status" id="submit-status"></div>
    </div>
    <button class="ghost-btn" id="btn-show-leaderboard-go" style="margin-top:4px;">🏆 Tabloyu Gör</button>
    <button class="big-btn" id="btn-restart" style="margin-top:14px;">TEKRAR DENE</button>
  </div>

  <div class="overlay hidden" id="overlay-leaderboard" style="z-index:10;">
    <div class="panel lb-panel">
      <div class="panel-head" id="lb-title">GLOBAL H-INDEX TABLOSU</div>
      <div class="lb-list" id="lb-list"></div>
      <button class="ghost-btn" id="btn-close-leaderboard" style="margin-top:14px;">Kapat</button>
    </div>
  </div>
</div>

function normalizeForFilter(s){
  return s.toLowerCase()
    .replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u")
    .replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/[^a-z0-9]/g,"");
}
function isProfane(name){

  return PROFANITY_LIST.some(w => n.includes(w));

/* --------------------------------------------------------- constants -- */
const GAME_W = 480, GAME_H = 800, GROUND_H = 70;
const GRAVITY = 0.45, FLAP = -8.6;
const BASE_GAP = 195, MIN_GAP = 150;
const PIPE_W = 76;
const BASE_SPEED = 3.0, MAX_SPEED = 5.6;
const BASE_SPACING = 270, MIN_SPACING = 220;
const STAGE_THRESH = [0, 10, 25, 45, 70];
const TRIVIA_GAP_MIN = 14, TRIVIA_GAP_MAX = 24;
const GRACE_FRAMES = 110;
const STAR_NEEDED = 10;
const POWER_MIN_S = 5, POWER_MAX_S = 20;

function nextTriviaGap(){ return TRIVIA_GAP_MIN + Math.floor(Math.random()*(TRIVIA_GAP_MAX-TRIVIA_GAP_MIN+1)); }
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}

const STAGE_SKY = [
  [[176,224,240],[235,245,250]],
  [[60,110,190],[150,195,225]],
  [[20,30,90],[70,60,140]],
  [[5,5,25],[25,15,55]],
  [[0,0,10],[10,5,25]]
];

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function lerpColor(c0,c1,t){ return [lerp(c0[0],c1[0],t),lerp(c0[1],c1[1],t),lerp(c0[2],c1[2],t)]; }
function rgb(c){ return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; }

function stageIndex(score){
  let idx = 0;
  for(let i=0;i<STAGE_THRESH.length;i++){ if(score>=STAGE_THRESH[i]) idx=i; }
  return clamp(idx,0,STAGE_THRESH.length-1);
}
function skyColors(score){
  const idx = stageIndex(score);
  if(idx>=STAGE_SKY.length-1) return STAGE_SKY[idx];
  const lo=STAGE_THRESH[idx], hi=STAGE_THRESH[idx+1];
  const t = hi===lo?0:(score-lo)/(hi-lo);
  return [lerpColor(STAGE_SKY[idx][0],STAGE_SKY[idx+1][0],t), lerpColor(STAGE_SKY[idx][1],STAGE_SKY[idx+1][1],t)];
}
function difficultyFor(score){
  const idx = stageIndex(score);
  return {
    speed: Math.min(BASE_SPEED + idx*0.5, MAX_SPEED),
    gap: Math.max(BASE_GAP - idx*11, MIN_GAP),
    spacing: Math.max(BASE_SPACING - idx*12, MIN_SPACING)
  };
}

function makeStars(n){

  for(let i=0;i<n;i++){
    arr.push({ x: Math.random()*GAME_W, y: Math.random()*GAME_H*0.82,
               r: [1,1,1,1.6,1.6,2.2][Math.floor(Math.random()*6)],
               a: 140 + Math.random()*115 });
  }
  return arr;
}
function makeNebula(n){
  const palette = [[150,60,170],[60,90,200],[200,70,130],[60,160,170]];
  const arr = [];
  for(let i=0;i<n;i++){
    arr.push({ x: Math.random()*GAME_W, y: Math.random()*GAME_H*0.55,
               r: 90 + Math.random()*110, c: palette[Math.floor(Math.random()*palette.length)] });
  }
  return arr;

function updateMeteors(dtScale){
  const idx = stageIndex(score);
  if(idx>=2 && Math.random() < 0.006*dtScale){
    const startX = Math.random()*GAME_W*0.7 + GAME_W*0.15;
    meteors.push({ x:startX, y:-20, vx:-2.2-Math.random()*1.5, vy:4+Math.random()*2, life:0, maxLife:70 });
  }
  for(let i=meteors.length-1;i>=0;i--){
    const m = meteors[i];
    m.x += m.vx*dtScale; m.y += m.vy*dtScale; m.life += dtScale;
    if(m.life>m.maxLife || m.y>GAME_H || m.x<-40) meteors.splice(i,1);
  }
}
function drawMeteors(){
  for(const m of meteors){
    const tailX = m.x - m.vx*7, tailY = m.y - m.vy*7;
    const g = ctx.createLinearGradient(m.x,m.y,tailX,tailY);
    g.addColorStop(0,"rgba(255,255,255,0.95)");
    g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.strokeStyle = g; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tailX,tailY); ctx.stroke();
  }
}
function drawGalaxy(cx,cy){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(performance.now()/30000);
  for(let arm=0; arm<2; arm++){
    ctx.beginPath();
    for(let t=0; t<=1; t+=0.06){
      const ang = t*Math.PI*2.3 + arm*Math.PI;
      const rad = t*46;
      const x = Math.cos(ang)*rad, y = Math.sin(ang)*rad*0.6;
      if(t===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = "rgba(200,170,255,0.5)";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,250,230,0.85)";
  ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function newPipe(x, gap, faceIdx){
  const margin = 95;
  const gapY = margin + gap/2 + Math.random()*(GAME_H-GROUND_H-2*margin-gap);
  const star = Math.random() < 0.3 ? { collected:false } : null;
  return { x, gap, gapY, passed:false, faceIdx, star };
}
function makePipes(startX, gap, spacing){
  const arr = [];
  for(let i=0;i<4;i++){
    arr.push(newPipe(startX + i*spacing, gap, Math.floor(Math.random()*faceImgs.length)));
  }
  return arr;
}

function pipeTopRect(p){ return {x:p.x, y:0, w:PIPE_W, h:p.gapY-p.gap/2}; }
function pipeBottomRect(p){ const by=p.gapY+p.gap/2; return {x:p.x, y:by, w:PIPE_W, h:GAME_H-GROUND_H-by}; }
function headHitCircle(){

function circleRectOverlap(c, r){
  const cx = clamp(c.x, r.x, r.x+r.w);
  const cy = clamp(c.y, r.y, r.y+r.h);
  const dx = c.x-cx, dy = c.y-cy;
  return (dx*dx + dy*dy) < c.r*c.r;
}

async function addScoreRPC(name, amount){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/add_score`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ p_name: name, p_amount: amount })
  });
  if(!res.ok) throw new Error("rpc failed: " + res.status);
  const data = await res.json();
  return (data && typeof data.total_score === "number") ? data.total_score : amount;
}

async function fetchProfile(name){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?name=eq.${encodeURIComponent(name)}&select=total_score`, {
    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if(!res.ok) throw new Error("profile fetch failed: " + res.status);
  const rows = await res.json();
  return rows.length ? rows[0] : null;
}

async function fetchLeaderboard(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=name,total_score&order=total_score.desc&limit=10`, {
    headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if(!res.ok) throw new Error("fetch failed: " + res.status);
  return res.json();
}

    lbList.innerHTML = `<div class="lb-empty">${TEXT[LANG].submitErr}</div>`;
  }
}

function triggerGameOver(faceIdx, msgKey){
  state = STATE.GAMEOVER;
  const t = TEXT[LANG];
  const msg = msgKey==="gravity" ? t.gravityMsg : t.rejectMsgs[Math.floor(Math.random()*t.rejectMsgs.length)];
  if(score>bestScore){ bestScore=score; try{ localStorage.setItem("phdFlappyBest", String(bestScore)); }catch(e){} }

  goMsg.textContent = msg;
  goScore.textContent = `${t.totalCitations}: ${score}  (${t.bestScore}: ${bestScore})`;
  goStage.textContent = `${t.stageReached}: ${t.stageNames[stageIndex(score)]}`;
  if(faceIdx!=null){
    goFace.src = faceImgs[faceIdx].src;
    goFaceWrap.style.display = "flex";
  } else {
    goFaceWrap.style.display = "none";
  }

  scoreSubmitBlock.style.display = score > 0 ? "block" : "none";
  nameInput.value = currentPlayerName || savedName;
  submitStatus.textContent = "";
  btnSubmitScore.disabled = false;
  btnSubmitScore.textContent = TEXT[LANG].submitBtn;

  ovGameover.classList.remove("hidden");

  if(currentPlayerName && score>0){
    doSubmit(currentPlayerName, true);
  }
}

function startCountdown(){
  state = STATE.COUNTDOWN;
  let n = 3;
  countdownNum.textContent = n;
  ovCountdown.classList.remove("hidden");
  const tick = ()=>{
    n -= 1;
    if(n<=0){
      ovCountdown.classList.add("hidden");
      state = STATE.PLAY;
      graceTimer = GRACE_FRAMES;
      return;
    }
    countdownNum.textContent = n;
    setTimeout(tick, 700);
  };
  setTimeout(tick, 700);
}

function nextTriviaQuestion(){
  if(triviaQueuePos >= triviaQueue.length){
    triviaQueue = shuffleArray(TRIVIA.map((_,i)=>i));
    triviaQueuePos = 0;
  }
  return TRIVIA[triviaQueue[triviaQueuePos++]];
}

function openTrivia(){
  state = STATE.TRIVIA;
  const raw = nextTriviaQuestion();
  const qd = raw[LANG];
  const order = shuffleArray([0,1,2]);
  currentTrivia = {
    q: qd.q,
    o: order.map(i => qd.o[i]),
    a: order.indexOf(raw.a)
  };
  triviaQ.textContent = currentTrivia.q;
  triviaFeedback.textContent = "";
  optBtns.forEach((btn,i)=>{
    btn.textContent = `${i+1}) ${currentTrivia.o[i]}`;
    btn.disabled = false;
    btn.classList.remove("correct","wrong");
  });
  ovTrivia.classList.remove("hidden");
}
function answerTrivia(i){
  if(state!==STATE.TRIVIA) return;
  const correctIdx = currentTrivia.a;
  const t = TEXT[LANG];
  optBtns.forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx===correctIdx) btn.classList.add("correct");
    else if(idx===i) btn.classList.add("wrong");
  });
  const isCorrect = (i===correctIdx);
  if(isCorrect){ score += 3; }
  triviaFeedback.textContent = isCorrect ? t.correct : t.wrong;
  triviaFeedback.style.color = isCorrect ? "#8df0a0" : "#f0a0a0";
  setTimeout(()=>{
    ovTrivia.classList.add("hidden");
    if(state===STATE.TRIVIA) startCountdown();
  }, 1100);
}
optBtns.forEach((btn,i)=> btn.addEventListener("click", ()=> answerTrivia(i)));

async function startGame(){
  const raw = startNameInput.value.trim();
  if(raw && isProfane(raw)){
    startNameWarn.textContent = TEXT[LANG].profanityWarn;
    return;
  }
  startNameWarn.textContent = "";
  currentPlayerName = raw;
  if(raw){
    try{ localStorage.setItem("phdFlappyName", raw); }catch(e){}
    savedName = raw;
    fetchProfile(raw).then(p=>{
      if(p) showToast(`${TEXT[LANG].welcomeBack} ${raw}! h-index: ${p.total_score}`);
      else showToast(`${TEXT[LANG].newProfile} ${raw}`);
    }).catch(()=>{});
  }
  ovStart.classList.add("hidden");
  resetGame();
}

btnStart.addEventListener("click", startGame);
btnRestart.addEventListener("click", ()=>{
  ovGameover.classList.add("hidden");
  resetGame();
});

btnShowLb.addEventListener("click", openLeaderboard);
btnShowLbGo.addEventListener("click", openLeaderboard);
btnCloseLb.addEventListener("click", ()=> ovLeaderboard.classList.add("hidden"));

btnSubmitScore.addEventListener("click", ()=>{
  let name = nameInput.value.trim();
  if(!name) name = randomAnonName();
  if(name.length > 24) name = name.slice(0, 24);
  doSubmit(name, false);
});

canvas.addEventListener("pointerdown", (e)=>{ e.preventDefault(); flap(); });
window.addEventListener("keydown", (e)=>{
  if(e.code==="Space" || e.code==="ArrowUp"){
    if(state===STATE.START){ e.preventDefault(); startGame(); return; }
    if(state===STATE.PLAY){ e.preventDefault(); flap(); return; }
    if(state===STATE.GAMEOVER){ e.preventDefault(); ovGameover.classList.add("hidden"); resetGame(); return; }
  } else if(e.code==="Escape" && state===STATE.START){
    ovLeaderboard.classList.add("hidden");
  } else if(state===STATE.TRIVIA && ["Digit1","Digit2","Digit3"].includes(e.code)){
    answerTrivia(parseInt(e.code.slice(-1),10)-1);
  }
});

/* --------------------------------------------------------- rendering -- */
function drawGradient(top, bot){
  const g = ctx.createLinearGradient(0,0,0,GAME_H);
  g.addColorStop(0, rgb(top));
  g.addColorStop(1, rgb(bot));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,GAME_W,GAME_H);
}

function drawBackground(){
  const idx = stageIndex(score);
  const [top,bot] = skyColors(score);
  drawGradient(top,bot);

  const starAlpha = clamp((idx-0.4)/2.2, 0, 1);
  if(starAlpha>0){
    ctx.save();
    for(const s of stars){
      const x = ((s.x - bgOffset*0.15) % GAME_W + GAME_W) % GAME_W;
      ctx.globalAlpha = (s.a/255) * starAlpha;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  const nebAlpha = clamp((idx-2.2)/1.6, 0, 1);
  if(nebAlpha>0){
    ctx.save();
    for(const n of nebula){
      const x = ((n.x - bgOffset*0.08) % (GAME_W+200) + (GAME_W+200)) % (GAME_W+200) - 100;
      ctx.globalAlpha = 0.27*nebAlpha;
      ctx.fillStyle = rgb(n.c);
      ctx.beginPath(); ctx.arc(x, n.y, n.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  drawMeteors();

  if(idx===0){
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    for(let i=0;i<6;i++){
      const bx = (((i*170 - bgOffset*0.3) % 860)+860)%860 - 120;
      ctx.beginPath(); ctx.ellipse(bx, 80+(i%3)*85, 56,22,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(bx+36, 60+(i%3)*85, 44,18,0,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = "#8ca0b4";
    for(let i=0;i<12;i++){
      const bx = (((i*70 - bgOffset*0.5) % 720)+720)%720 - 60;
      const h = 48 + (i*41)%90;
      ctx.fillRect(bx, GAME_H-GROUND_H-h, 40, h);
    }
  } else if(idx===1){
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    for(let i=0;i<4;i++){
      const bx = (((i*220 - bgOffset*0.2) % 940)+940)%940 - 150;
      ctx.beginPath(); ctx.ellipse(bx, 110+(i%2)*110, 80,20,0,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = "#fff0b4";
    ctx.beginPath(); ctx.arc(GAME_W-90,100,44,0,Math.PI*2); ctx.fill();
  } else if(idx>=2){
    const moonColor = idx<=2 ? [230,230,235] : [210,210,220];
    ctx.fillStyle = rgb(moonColor);
    ctx.beginPath(); ctx.arc(90,110,38,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.arc(78,100,8,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(102,124,5,0,Math.PI*2); ctx.fill();
  }
  if(idx>=4){
    ctx.fillStyle = "#be8c5a";
    ctx.beginPath(); ctx.arc(GAME_W-80,200,28,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(220,180,140,0.8)"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(GAME_W-80,200,56,13,0,0,Math.PI*2); ctx.stroke();
    drawGalaxy(110, 430);
  }

  const groundY = GAME_H-GROUND_H;
  if(idx===0){
    ctx.fillStyle="#78552f"; ctx.fillRect(0,groundY,GAME_W,GROUND_H);
    ctx.fillStyle="#3ca05a"; ctx.fillRect(0,groundY,GAME_W,9);
  } else if(idx===1){
    ctx.fillStyle="#5a6e5e"; ctx.fillRect(0,groundY,GAME_W,GROUND_H);
    ctx.fillStyle="#7a967a"; ctx.fillRect(0,groundY,GAME_W,9);
  } else {
    ctx.fillStyle="#22222f"; ctx.fillRect(0,groundY,GAME_W,GROUND_H);
    ctx.strokeStyle="rgba(100,110,150,0.35)"; ctx.lineWidth=2;
    for(let gx=0; gx<GAME_W; gx+=26){
      ctx.beginPath(); ctx.moveTo(gx,groundY); ctx.lineTo(gx,GAME_H); ctx.stroke();
    }
    ctx.fillStyle="#5ac8dc"; ctx.fillRect(0,groundY,GAME_W,3);
  }
}

function drawPipe(p){
  const idx = stageIndex(score);
  const bodyA = idx<2 ? "#3b4f72" : "#2a2f52";
  const bodyB = idx<2 ? "#6c89b8" : "#4e4f8c";
  const glow = idx<2 ? "#8fd6ff" : "#c08cff";

  [pipeTopRect(p), pipeBottomRect(p)].forEach((r, seg)=>{
    if(r.h<=0) return;
    const g = ctx.createLinearGradient(r.x,0,r.x+r.w,0);
    g.addColorStop(0, bodyA); g.addColorStop(0.5, bodyB); g.addColorStop(1, bodyA);
    ctx.fillStyle = g;
    ctx.fillRect(r.x, r.y, r.w, r.h);

    const stripeH = 14;
    const stripeY = seg===0 ? r.y+r.h-stripeH : r.y;
    ctx.save();
    ctx.beginPath(); ctx.rect(r.x, stripeY, r.w, stripeH); ctx.clip();
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(r.x, stripeY, r.w, stripeH);
    ctx.fillStyle = "#e6b428";
    for(let sx=-stripeH; sx<r.w+stripeH; sx+=14){
      ctx.save();
      ctx.translate(r.x+sx, stripeY);
      ctx.rotate(Math.PI/4);
      ctx.fillRect(-4, -20, 8, 40);
      ctx.restore();
    }
    ctx.restore();

    ctx.fillStyle = glow;
    const capY = seg===0 ? r.y+r.h-3 : r.y;
    ctx.fillRect(r.x-3, capY, r.w+6, 3);
  });

  const top = pipeTopRect(p);
  if(top.h>10){
    const cx = p.x + PIPE_W/2, cy = top.y+top.h;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx,cy,30,0,Math.PI*2); ctx.fill();
    const img = faceImgs[p.faceIdx];
    if(img && img.complete && img.naturalWidth>0){
      ctx.save();
      ctx.beginPath(); ctx.arc(cx,cy,27,0,Math.PI*2); ctx.clip();
      ctx.drawImage(img, cx-27, cy-27, 54, 54);
      ctx.restore();
    }
    ctx.strokeStyle = "#191928"; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(cx,cy,30,0,Math.PI*2); ctx.stroke();
  }

  if(p.star && !p.star.collected){
    drawStar(p.x + PIPE_W/2, p.gapY);
  }
}

function drawStar(x,y){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(performance.now()/900);
  ctx.fillStyle = "#ffe066";
  ctx.strokeStyle = "#a8790a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1 = (i*2*Math.PI)/5 - Math.PI/2;
    const a2 = a1 + Math.PI/5;
    const x1 = Math.cos(a1)*11, y1 = Math.sin(a1)*11;
    const x2 = Math.cos(a2)*4.5, y2 = Math.sin(a2)*4.5;
    if(i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
    ctx.lineTo(x2,y2);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawStudent(){
  const angle = clamp(-student.vel*3.2, -25, 35);
  ctx.save();
  ctx.translate(student.x, student.y);

  if(powerMode){
    const pulse = 0.55 + 0.4*Math.sin(performance.now()/110);
    const grad = ctx.createRadialGradient(0,0,4,0,0,42);
    grad.addColorStop(0, `rgba(255,90,40,${0.6*pulse})`);
    grad.addColorStop(1, "rgba(255,90,40,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0,42,0,Math.PI*2); ctx.fill();
  }

  ctx.rotate(-angle*Math.PI/180);
  if(graceTimer>0 && Math.floor(performance.now()/100)%2===0){
    ctx.globalAlpha = 0.45;
  }
  const heroImg = flyerImgs[selectedHero];
  if(heroImg && heroImg.complete && heroImg.naturalWidth>0){
    ctx.drawImage(heroImg, -student.w/2, -student.h/2, student.w, student.h);
  } else {
    ctx.fillStyle="#f0d8b0"; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ------------------------------------------------------------ update -- */
let lastTime = 0;
function update(dtScale){
  const d = difficultyFor(score);

  if(state!==STATE.PLAY) return;

  bgOffset += d.speed*dtScale;
  student.vel = Math.min(student.vel + GRAVITY*dtScale, 11);
  student.y += student.vel*dtScale;

  if(graceTimer>0) graceTimer -= dtScale;
  if(powerMode){
    powerTimer -= dtScale;
    energyFill.style.width = `${clamp(powerTimer/powerTimerMax,0,1)*100}%`;
    if(powerTimer<=0){
      powerMode = false;
      energyWrap.classList.add("hidden");
      graceTimer = GRACE_FRAMES;
      showToast(TEXT[LANG].powerOff);
    }
  }

  const hc = headHitCircle();

  for(const p of pipes) p.x -= d.speed*dtScale;
  if(pipes[0].x < -PIPE_W){
    pipes.shift();
    const last = pipes[pipes.length-1];
    pipes.push(newPipe(last.x + d.spacing, d.gap, Math.floor(Math.random()*faceImgs.length)));
  }

  for(const p of pipes){
    if(!p.passed && p.x+PIPE_W < student.x){
      p.passed = true;
      onScorePoint();
    }
    if(p.star && !p.star.collected){
      const sx = p.x+PIPE_W/2, sy = p.gapY;
      const dx = sx-student.x, dy = sy-student.y;
      if(dx*dx+dy*dy < 30*30){
        p.star.collected = true;
        starsCollected++;
        if(starsCollected>=STAR_NEEDED){ starsCollected=0; activatePower(); }
      }
    }
    if(graceTimer<=0 && !powerMode &&
       (circleRectOverlap(hc, pipeTopRect(p)) || circleRectOverlap(hc, pipeBottomRect(p)))){
      triggerGameOver(p.faceIdx, "reject");
      return;
    }
  }

  if(student.y - student.h/2 < 0){ student.y = student.h/2; student.vel = 0; }
  if(student.y + student.h/2 > GAME_H-GROUND_H){
    if(graceTimer>0 || powerMode){ student.y = GAME_H-GROUND_H-student.h/2; student.vel = 0; }
    else { triggerGameOver(null, "gravity"); return; }
  }

  updateMeteors(dtScale);

  if(toastTimer>0){
    toastTimer -= dtScale;
    toastEl.textContent = toastText;
    toastEl.classList.add("show");
    if(toastTimer<=0) toastEl.classList.remove("show");
  }
}

function render(){
  drawBackground();
  for(const p of pipes) drawPipe(p);
  drawStudent();
  hudScore.textContent = `${TEXT[LANG].citations}: ${score}`;
  hudStage.textContent = TEXT[LANG].stageNames[stageIndex(score)];
  hudStars.textContent = `${TEXT[LANG].starsLabel} ${starsCollected}/${STAR_NEEDED}`;
  const idx = stageIndex(score);
  const lightText = idx>=2;
  hudScore.style.color = lightText ? "#fff" : "#1a1a2a";
  hudStage.style.color = lightText ? "#e8e8f5" : "#1a1a2a";
  hudStars.style.color = lightText ? "#ffe066" : "#6b5300";
}

function loop(ts){
  if(!lastTime) lastTime = ts;
  const dtScale = clamp((ts-lastTime)/16.6667, 0, 3);
  lastTime = ts;
  update(dtScale);
  render();
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------- bootstrap --- */
function resizeCanvas(){
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width*dpr);
  canvas.height = Math.round(rect.height*dpr);
  const scale = (rect.width/GAME_W) * dpr;
  ctx.setTransform(scale,0,0,scale,0,0);
}
window.addEventListener("resize", resizeCanvas);

stars = makeStars(80);
nebula = makeNebula(6);
student = { x: GAME_W*0.27, y: GAME_H/2, vel:0, w:76, h:50 };
pipes = makePipes(GAME_W+120, BASE_GAP, BASE_SPACING);
score = 0; lastStage = 0;

resizeCanvas();
requestAnimationFrame(loop);

if(location.search.includes("debug")){
  window.__dbg = {
    get: ()=>({ state, score, starsCollected, powerMode, powerTimer, graceTimer,
                 currentPlayerName, studentY: student.y, studentX: student.x,
                 pipeCount: pipes.length, selectedHero, nextTrivia }),
    setHero: (i)=>{ selectedHero = i; },
    setScore: (v)=>{ score = v; },
    setStars: (v)=>{ starsCollected = v; },
    activatePower,
    startGame,
    resetGame,
    flap,
    headHitCircle,
    pipeTopRect,
    pipeBottomRect,
    isProfane,
    pipes: ()=>pipes
  };
}

})();
</script>
